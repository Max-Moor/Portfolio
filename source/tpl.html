<title>Max Moor, carnet de chantier</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&family=Caveat:wght@600&display=swap">
<style>
/* Concept: un carnet de chantier. Rail de navigation collant à gauche (où je suis, quoi filtrer),
   puis une colonne de chapitres chronologiques qui rangent texte, photos, vidéos et documents au même endroit. */
:root{
  --bg:#E8EBF2; --surface:#F6F7FB; --ink:#0A1440; --muted:#4F5A7E; --line:#C4CBDD;
  --accent:#D33641; --accent-ink:#FFFFFF; --mark:#BFC9F2; --night:#0A1448; --night-fg:#F4F6FF;
  --font-d:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-m:'DM Mono',ui-monospace,Menlo,monospace;
  --font-h:'Caveat','Comic Sans MS',cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1226; --surface:#161B38; --ink:#EEF0FA; --muted:#A3ACCB; --line:#2E3560;
  --accent:#F0626C; --accent-ink:#0E1226; --mark:#3B4BA8; --night:#070A1C; --night-fg:#F4F6FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1226; --surface:#161B38; --ink:#EEF0FA; --muted:#A3ACCB; --line:#2E3560;
  --accent:#F0626C; --accent-ink:#0E1226; --mark:#3B4BA8; --night:#070A1C; --night-fg:#F4F6FF; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--font-b);
  background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-0.02em;line-height:1.02}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.mono{font-family:var(--font-m);font-size:12px;letter-spacing:.08em;text-transform:uppercase}

/* ---------- cadre : rail + colonne ---------- */
.frame{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:0 56px}
.rail{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;padding:24px 0;display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.brand{font:800 30px/1 var(--font-d);letter-spacing:-.03em}
.brand small{display:block;font:400 12px/1.4 var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.lang{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;align-self:flex-start}
.lang button{font:500 13px var(--font-m);letter-spacing:.08em;border:0;background:transparent;color:var(--ink);padding:7px 14px;cursor:pointer;min-height:36px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rail h2{font:500 11px var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;font:600 15px var(--font-b);border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer;transition:border-color .2s,background .2s}
.chip span{font:500 12px var(--font-m);color:var(--muted)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] span{color:var(--bg)}
.toc{list-style:none;margin:0;padding:0 0 0 14px;position:relative;display:flex;flex-direction:column;gap:2px}
.toc::before{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:2px;background:var(--line)}
.toc a{display:block;position:relative;text-decoration:none;padding:5px 0 5px 12px;font:500 14px/1.3 var(--font-b);color:var(--muted);transition:color .2s,opacity .2s}
.toc a::before{content:"";position:absolute;left:-15px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--line);transition:background .2s,border-color .2s,transform .2s}
.toc a b{display:block;font:500 11px var(--font-m);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--ink);font-weight:600}
.toc a.on::before{background:var(--ink);border-color:var(--ink);transform:scale(1.15)}
.toc a.here{color:var(--ink);font-weight:600}
.toc a.here::before{background:var(--accent);border-color:var(--accent);transform:scale(1.25);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 25%,transparent)}
.toc a i{display:block;font:500 10px var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-style:normal;margin-top:1px}
.toc a.dim{opacity:.35}
.hint{font:400 13px/1.45 var(--font-b);color:var(--muted)}

/* ---------- colonne principale ---------- */
.main{min-width:0;padding:24px 0 0}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:36px 48px;align-items:center;padding:40px 0 56px}
.kicker{display:inline-flex;gap:10px;align-items:center;font:500 12px var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kicker i{width:34px;height:2px;background:var(--accent);display:block}
.hero h1{font-size:clamp(52px,8.2vw,128px);font-weight:800;margin:18px 0 18px;line-height:.92}
.hl{background:linear-gradient(transparent 58%,var(--mark) 58% 92%,transparent 92%);padding:0 .06em}
.tag{font:700 clamp(22px,2.6vw,34px)/1.15 var(--font-d);letter-spacing:-.02em;color:var(--accent)}
.lead{max-width:34em;margin-top:18px;color:var(--ink)}
.start{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;gap:10px;align-items:center;font:600 15px var(--font-b);text-decoration:none;border:2px solid var(--ink);padding:11px 16px;border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .2s,background .2s,color .2s}
.btn:hover{transform:translateY(-2px);background:var(--ink);color:var(--bg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn svg{width:16px;height:16px;flex:none}
.first{display:inline-flex;flex-wrap:wrap;gap:6px;margin-top:14px;font-size:15px;text-decoration:none;border:2px solid var(--accent);padding:8px 14px;background:var(--surface);color:var(--ink);transition:background .2s,color .2s}
.first b{color:var(--accent)}
.first:hover{background:var(--accent);color:var(--accent-ink)}
.first:hover b{color:var(--accent-ink)}
.tip{margin-top:14px;font-size:14px;color:var(--muted);max-width:34em}
.portrait{position:relative;justify-self:center;width:min(100%,420px);rotate:2deg}
.portrait img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 20%;border:3px solid var(--ink);background:var(--night);box-shadow:12px 12px 0 var(--accent)}
.tape{position:absolute;width:110px;height:30px;background:color-mix(in srgb,var(--mark) 82%,transparent);top:-14px;left:50%;translate:-50% 0;rotate:-4deg}
.note{position:absolute;right:-6px;bottom:-34px;font:600 30px/1 var(--font-h);rotate:-5deg;color:var(--ink);display:flex;gap:6px;align-items:flex-end}
.note svg{width:46px;height:34px;color:var(--accent);rotate:10deg}

/* carte vidéo d'intro (à venir) */
.intro{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;border:2px dashed var(--ink);padding:16px 18px;margin:0 0 72px;background:var(--surface)}
.intro .pl{width:56px;height:56px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.intro p{font-size:15px;color:var(--muted)}
.intro b{display:block;font:700 22px var(--font-d);color:var(--ink);letter-spacing:-.02em}

/* ---------- chapitres ---------- */
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 40px;margin-bottom:28px}
.sec-h h2{font-size:clamp(40px,6vw,84px);font-weight:800}
.sec-h p{max-width:30em;color:var(--muted)}
.tl{position:relative;padding-left:34px}
.tl::before{content:"";position:absolute;left:9px;top:8px;bottom:0;width:3px;background:repeating-linear-gradient(var(--ink) 0 10px,transparent 10px 16px)}
.ch{position:relative;padding:0 0 64px;transition:opacity .3s}
.ch::before{content:"";position:absolute;left:-34px;top:10px;width:21px;height:21px;border-radius:50%;background:var(--bg);border:4px solid var(--ink)}
.ch.here::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}
.ch.next::before{border-style:dashed}
.ch.dim{opacity:.3}
.ch-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-bottom:12px}
.when{font:500 13px var(--font-m);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.st{font:500 11px var(--font-m);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--ink);border-radius:999px;padding:2px 9px}
.st.now{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ch h3{font-size:clamp(30px,3.8vw,52px);font-weight:800;margin-bottom:14px}
.body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px 40px;align-items:start}
.solo{justify-self:center;width:min(100%,300px);padding-top:6px}
.body.one{grid-template-columns:minmax(0,1fr)}
.txt p{max-width:36em}
.txt ul{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;max-width:36em}
.txt li{position:relative;padding-left:22px;font-size:15px;color:var(--muted)}
.txt li::before{content:"";position:absolute;left:0;top:.55em;width:10px;height:2px;background:var(--accent)}
.proofs.row .proof.wide{grid-column:1/-1}
.bthumb{width:360px}
.bthumb img{display:block;width:100%;aspect-ratio:2.28/1;object-fit:cover;border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--accent)}
@media(max-width:760px){.bthumb{width:150px}.bthumb img{aspect-ratio:1/1}}
.proofs.row.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:760px){.proofs.row.c2{grid-template-columns:1fr}}
.proofs.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.ch.hot h3{color:var(--ink)}
.ch.hot .txt p{font-size:19px}
.ch.hot::after{content:"";position:absolute;inset:-14px 0 36px -14px;border:2px solid var(--accent);pointer-events:none}
.proofs{display:flex;flex-direction:column;gap:14px;min-width:0}
.proof{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;text-decoration:none;border:2px solid var(--ink);background:var(--surface);padding:10px;transition:transform .25s,box-shadow .25s,opacity .3s}
a.proof:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--accent)}
.proof.dim{opacity:.3}
.proof .lbl{font:500 11px var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.proof h4{font-size:21px;font-weight:700;margin:2px 0 4px;line-height:1.08}
.proof p{font-size:14px;line-height:1.45;color:var(--muted)}
.proof .go{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font:600 12px var(--font-m);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent);border-radius:999px;padding:6px 14px;transition:background .2s,color .2s,border-color .2s}
a.proof{cursor:pointer}
a.proof:hover .go{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dwrap{position:relative;width:124px;flex:none}
.dwrap::before{content:"";position:absolute;inset:6px -6px -6px 6px;border:1.5px solid var(--ink);background:var(--surface)}
.dwrap .dthumb{position:relative;width:100%;transition:transform .25s}
a.proof:hover .dwrap .dthumb{transform:translate(-3px,-3px)}
.dbadge{position:absolute;left:-8px;top:10px;z-index:2;background:var(--ink);color:var(--bg);font:500 11px var(--font-m);letter-spacing:.08em;padding:3px 8px}
.vthumb{width:132px;aspect-ratio:16/10;background:var(--night);color:var(--night-fg);position:relative;overflow:hidden;display:grid;place-items:center}
.vthumb::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.05) 10px 11px)}
.vthumb.has::before{display:none}.vthumb.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 38%;filter:brightness(.7)}.vthumb.logo{background:#fff;border:1.5px solid var(--ink)}.vthumb.logo img{box-sizing:border-box;object-fit:contain;padding:14px 16px;filter:none}.vthumb.logo i{width:34px;height:34px}.vthumb.logo i svg{width:12px;height:12px}
.vthumb i{position:relative;width:40px;height:40px;border-radius:50%;background:var(--accent);display:grid;place-items:center;transition:transform .25s}
a.proof:hover .vthumb i{transform:scale(1.18)}
.vthumb i svg{width:16px;height:16px;color:var(--accent-ink);margin-left:2px}
.vthumb em{position:absolute;left:8px;bottom:6px;font:500 10px var(--font-m);letter-spacing:.08em;text-transform:uppercase;font-style:normal;color:var(--night-fg);opacity:.8}
.dthumb{width:78px;aspect-ratio:7/10;object-fit:cover;border:1.5px solid var(--ink);display:block;box-shadow:3px 3px 0 var(--accent)}
.lthumb{width:78px;aspect-ratio:7/10;border:1.5px solid var(--ink);background:var(--night);color:var(--night-fg);display:grid;place-items:center;font:500 11px var(--font-m);letter-spacing:.08em;text-align:center}
.lthumb svg{width:22px;height:22px;display:block;margin:0 auto 4px}
.proof.locked{border-style:dashed;background:transparent}

/* Drop Loop : prix + planche photo */
.prizes{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 24px}
.stamp{flex:1 1 260px;border:3px solid var(--accent);color:var(--ink);padding:12px 16px;rotate:-1.2deg;background:var(--surface);position:relative}
.stamp:nth-child(2){rotate:1deg}
.stamp{display:flex;gap:14px;align-items:center}
@keyframes tvib{0%{transform:translateY(0) rotate(-4deg)}25%{transform:translateY(-2px) rotate(0deg)}50%{transform:translateY(0) rotate(4deg)}75%{transform:translateY(-2px) rotate(0deg)}100%{transform:translateY(0) rotate(-4deg)}}
.stamp .tr{transform-origin:50% 92%;animation:tvib 1.8s ease-in-out infinite}
.stamp:nth-child(2) .tr{animation-delay:-.7s}
@media (prefers-reduced-motion:reduce){.stamp .tr{animation:none}}
#c-droploop .body .proofs{transform:translateY(-10px)}
#c-droploop .prizes{margin-top:20px}.stamp .tr{flex:none;width:50px;height:56px}.stamp .tx{min-width:0}.stamp b{display:block;font:800 22px/1.05 var(--font-d);letter-spacing:-.02em}
.stamp span{font-size:14px;color:var(--muted)}
.stamp .mono{display:block;color:var(--accent);margin-bottom:4px}
.sheet h4{font:500 12px var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;display:flex;align-items:center;gap:12px}
.sheet h4::after{content:"";height:2px;flex:1;background:var(--line)}
.sheet h4 b{color:var(--ink)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px}
.pol{margin:0;background:var(--surface);border:2px solid var(--ink);padding:8px 8px 10px;cursor:zoom-in;transition:transform .3s;rotate:var(--r,0deg);text-align:left;display:block;font:inherit;color:inherit;width:100%}
.pol:hover{transform:translateY(-4px) rotate(0deg)}
.pol img{display:block;width:100%;aspect-ratio:var(--ar,3/4);object-fit:cover}
.pol figcaption{font-size:13px;line-height:1.35;margin-top:8px;color:var(--muted)}
.pol figcaption b{display:block;font:700 15px var(--font-d);color:var(--ink);letter-spacing:-.01em}
.wide{grid-column:span 2}
.row.gal{grid-template-columns:repeat(6,minmax(0,1fr))}.row.gal .pol{grid-column:span 2}.row.gal .pol.wide{grid-column:span 3}
@media(max-width:760px){.row.gal{grid-template-columns:repeat(2,minmax(0,1fr))}.row.gal .pol,.row.gal .pol.wide{grid-column:auto}.row.gal .pol.wide{grid-column:1/-1}}
.pv{position:fixed;inset:0;z-index:60;background:rgba(10,11,12,.92);display:flex;flex-direction:column;align-items:center;padding:14px 14px 18px}
.pv .bar{width:min(100%,1200px);display:flex;align-items:center;gap:12px;color:#F1F2F3;margin-bottom:10px}
.pv .bar b{font:700 17px var(--font-d);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv .bar button{font:600 13px var(--font-b);border:2px solid #F1F2F3;background:transparent;color:#F1F2F3;padding:7px 12px;cursor:pointer;border-radius:999px}
.pv .bar button.x{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pv iframe{flex:1;width:min(100%,1200px);border:0;background:#fff;border-radius:6px;min-height:0}
.pv.phone iframe{width:min(100%,420px)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,11,12,.9);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lb figure{margin:0;max-width:min(92vw,820px);color:#F1F2F3}
.lb img{max-width:100%;max-height:78vh;display:block;margin:0 auto;border:3px solid #F1F2F3}
.lb figcaption{margin-top:12px;font-size:15px;text-align:center}

/* ---------- en bref + contact ---------- */
.bref{padding:24px 0 80px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:36px 40px;margin-top:20px}
.li span{white-space:pre-line}.jobs .li span:last-child{white-space:pre}
.blk h3{font:500 12px var(--font-m);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.li{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:9px 0;font-size:15px}
.li span:last-child{color:var(--muted);text-align:right;font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools span{border:1.5px solid var(--ink);padding:3px 11px;border-radius:999px;font-size:14px;background:var(--surface)}
.lv{display:inline-flex;gap:3px;vertical-align:middle}
.lv i{width:16px;height:6px;background:var(--line);display:block}
.lv i.f{background:var(--accent)}
.contact{background:var(--night);color:var(--night-fg);margin:0 calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:72px max(16px,env(safe-area-inset-right,0px)) 40px}
.contact .in{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:40px 64px;align-items:end}
.contact h2{font-size:clamp(56px,10vw,150px);font-weight:800;line-height:.9}
.contact h2 em{font-style:normal;color:#FF7A84}
.contact p{max-width:30em;margin-top:18px;color:#C3C9CE}
.coords{display:flex;flex-direction:column;gap:10px;margin-top:28px;font:500 15px var(--font-m)}
.coord{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;border-bottom:1px solid #3a4046;padding-bottom:10px}
.coord span.k{color:#8a949c;font-size:11px;letter-spacing:.1em;text-transform:uppercase;min-width:74px}
.coord a,.coord b{font-weight:500;color:var(--night-fg);text-underline-offset:4px;overflow-wrap:anywhere}
.cp{font:500 11px var(--font-m);letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1.5px solid #5a636b;color:var(--night-fg);padding:3px 9px;border-radius:999px;cursor:pointer}
.cp:hover{border-color:var(--accent);color:var(--accent)}
.contact img{width:100%;max-width:320px;justify-self:end;display:block;border:3px solid var(--night-fg);rotate:-2deg;aspect-ratio:3/4;object-fit:cover;object-position:50% 30%;box-shadow:10px 10px 0 var(--accent)}
.foot{max-width:1360px;margin:48px auto 0;font:400 12px var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:#8a949c;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}

/* ---------- mobile ---------- */
.mbar{display:none}
@media (max-width:980px){
  .frame{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;gap:10px;align-items:center;background:var(--bg);padding:10px 0;border-bottom:2px solid var(--ink);margin-bottom:8px;overflow-x:auto}

let io;
function spy(){

  const set=id=>links.forEach(a=>a.classList.toggle('on',a.dataset.t===id));

const mph=x=>`<button class="mph${x.w?' wide':''}${/^(\d+)\/(\d+)$/.test(x.ar||'')&&(+RegExp.$1>+RegExp.$2)?' land':''}" type="button" style="--r:${(x.r||0)/2}deg" data-img="${x.i}" data-cap="${esc(T(x.t))} · ${esc(T(x.c))}"><img src="${IMG[x.i]}" alt="${esc(T(x.c))}" loading="lazy"><span class="mcp"><b>${esc(T(x.t))}</b>${esc(T(x.c))}</span></button>`;
const PAL=[0,1,2,3];
function mchapter(c,i){
  const s=S[L],bl=T(c.b);
  const pal=c.here?1:PAL[i%4];
  const yr=(c.when[0].match(/20\d\d/)||[''])[0];
  const tags=`<span class="tag1">${esc(T(c.when))}</span>`+(c.badge?`<span class="tag2">${esc(T(c.badge))}</span>`:'')+(c.st==='past'?'':`<span class="tag2">${STATUS[L][c.st]}</span>`);
  let x=`<div class="tags">${tags}</div>`;
  if(c.here)x+=`<div class="here-pin"><i></i>${esc(s.here)}</div>`;
  x+=`<h3>${esc(T(c.t))}</h3><p class="dd">${esc(T(c.d))}</p>`;
  if(bl.length)x+=`<ul>${bl.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`;
  if(c.p.length)x+=`<div class="sub">${c.p.some(p=>p.k==='video')?'▶ ':''}${esc(MS[L].pr)}</div><div class="hs">${c.p.map(mtile).join('')}</div>`;
  const solo=!c.big&&c.gal&&c.gal.length===1;
  if(solo)x+=`<div class="mg2 solo">${mph(c.gal[0])}</div>`;
  const photos=(c.big||(c.gal&&!solo));
  if(c.big){
    x+=`<div class="sub">${esc(s.sheetT)}</div><div class="mtro">${PRIZES.map((z,k)=>`<div>${TROPHY(k?'#C9CED2':'#FFD23F')}<p style="margin:0"><small>${esc(T(z.pl))}</small><b>${esc(T(z.t))}</b><span>${esc(T(z.d))}</span></p></div>`).join('')}</div>`;
    x+=SHEET.map(q=>`<div class="sub">${s.step} ${q.g} · ${esc(s.steps[q.g])}</div><div class="mg2">${q.items.map(mph).join('')}</div>`).join('');
  }else if(c.gal&&!solo)x+=`<div class="sub">${esc(MS[L].ph)}</div><div class="mg2">${c.gal.map(mph).join('')}</div>`;
  return [`<section class="mc p${pal}" data-id="${c.id}" data-y="${esc(yr)}" data-t="${esc(T(c.short))}"${c.here?' data-here="1"':''}><div class="my">${yr}</div><div class="in">${x}</div><div class="dn">${photos?`<span>↓ ${esc(MS[L].ph)}</span>`:'↓'}</div></section>`];
}
function mobApp(){
  const host=document.getElementById('mob');
  if(!mq.matches){host.innerHTML='';return}
  const s=S[L],n=counts(),m=MS[L];
  const hero=`<section class="mc hero0" data-id="top" data-y="" data-t="${esc(s.kicker)}"><div class="in"><div class="kk"><i></i>${esc(s.kicker)}</div><h1>${esc(s.h1a)} <em>${esc(s.h1b)}</em></h1><div class="tg">${esc(s.tagline)}</div><p class="ld">${esc(s.lead)}</p><div class="pt"><img src="${IMG.portrait}" alt="Max Moor"></div><div class="sw">${m.sw}<span>→</span></div></div><div class="dn">↓</div></section>`;
  const cv=`<section class="mc cv" data-id="bref" data-y="CV" data-t="${esc(s.brefT)}"><div class="in"><h3>${esc(s.brefT)}</h3><p class="dd">${esc(s.brefIntro)}</p>
    <div class="blk"><h5>${s.bLang}</h5>${B.lang.map(x=>`<div class="li"><span>${esc(T(x.a))}</span><span>${lv(x.lv)} ${esc(T(x.n))}</span></div>`).join('')}</div>
    <div class="blk"><h5>${s.bSchool}</h5>${B.school.map(x=>`<div class="li"><span>${esc(T(x.a))}</span><span>${esc(T(x.n))}</span></div>`).join('')}</div>
    <div class="blk"><h5>${s.bTools}</h5><div class="tl2">${B.tools.map(x=>`<span>${x}</span>`).join('')}</div></div>
    <div class="blk"><h5>${s.bLic}</h5>${B.lic.map(x=>`<div class="li"><span>${esc(T(x.a))}</span><span>${esc(T(x.n))}</span></div>`).join('')}</div>
    <div class="blk"><h5>${s.bJobs}</h5>${B.jobs.map(x=>`<div class="li"><span>${esc(T(x.a))}</span><span>${esc(T(x.n))}</span></div>`).join('')}</div></div><div class="dn">↓</div></section>`;
  const ct=`<section class="mc ct" data-id="contact" data-y="@" data-t="Contact"><div class="in"><h2>${esc(s.cT1)} <em>${esc(s.cT2)}</em></h2><p>${esc(s.cP)}</p>
    <div class="cc"><div><small>${s.mail}</small><b>m.moor@student.helmo.be</b></div><button type="button" data-copy="m.moor@student.helmo.be">${s.copy}</button></div>
    <div class="cc"><div><small>${s.phone}</small><b>0478 49 86 55</b></div><button type="button" data-copy="0478 49 86 55">${s.copy}</button></div>
    <div class="cc"><div><small>LinkedIn</small><b>Max Moor</b></div><a class="b" href="${LK.linkedin}" target="_blank" rel="noopener">↗</a></div>
    <div class="ph"><img src="${IMG.full}" alt="Max Moor" loading="lazy"></div></div><div class="dn">↓</div></section>`;
  const slides=[hero,...C.flatMap(mchapter),cv,ct];
  const lang=LANGS.map(l=>`<button type="button" data-l="${l}" aria-pressed="${L===l}">${l.toUpperCase()}</button>`).join('');
  host.innerHTML=`<div class="mtop"><b>Max Moor<i>.</i></b><div class="lang" role="group" aria-label="Langue / Taal / Language / Sprache">${lang}</div></div>
   <div class="deck" id="deck">${slides.join('')}</div>
   <div class="mnav"><div class="cur"><b id="mcy"></b><span id="mct"></span><em id="mcn"></em></div><div class="row2"><button class="ar" type="button" data-mv="-1" aria-label="‹">‹</button><div class="tks" id="tks"></div><button class="ar" type="button" data-mv="1" aria-label="›">›</button></div></div>`;
  const deck=document.getElementById('deck'),sl=[...deck.children];
  document.getElementById('tks').innerHTML=sl.map((e,k)=>`<button class="tk${e.dataset.here?' h':''}" type="button" data-mi="${k}" aria-label="${esc(e.dataset.t)}"></button>`).join('');
  const go=(k,smooth)=>{k=Math.max(0,Math.min(sl.length-1,k));const e=sl[k];deck.scrollTo({left:e.offsetLeft-(deck.clientWidth-e.offsetWidth)/2,behavior:smooth?'smooth':'auto'})};
  const upd=()=>{
    const mid=deck.scrollLeft+deck.clientWidth/2;let b=0,bd=1e9;
    sl.forEach((e,k)=>{const d=Math.abs(e.offsetLeft+e.offsetWidth/2-mid);if(d<bd){bd=d;b=k}});
    MI=b;mSeen.add(b);
    sl.forEach((e,k)=>{e.classList.toggle('on',k===b);if(mSeen.has(k))e.classList.add('seen')});
    document.querySelectorAll('.tk').forEach((t,k)=>{t.classList.toggle('on',k===b);t.classList.toggle('seen',mSeen.has(k)&&k!==b)});
    sl.forEach(e=>{const n=e.querySelector('.in');if(n)e.classList.toggle('ov',n.scrollHeight>n.clientHeight+24&&n.scrollTop<24)});
    const e=sl[b];document.getElementById('mcy').textContent=e.dataset.y;document.getElementById('mct').textContent=e.dataset.t;document.getElementById('mcn').textContent=`${b+1} ${m.of} ${sl.length}`;
    const ar=document.querySelectorAll('.mnav .ar');ar[0].disabled=b===0;ar[1].disabled=b===sl.length-1;
  };
  let tk=0;deck.addEventListener('scroll',()=>{if(!tk)tk=requestAnimationFrame(()=>{tk=0;upd()})},{passive:true});
  host.onclick=e=>{const t=e.target.closest('[data-mi],[data-mv]');if(!t)return;go(t.dataset.mi!==undefined?+t.dataset.mi:MI+ +t.dataset.mv,true)};
  deck.addEventListener('scroll',()=>{},{passive:true});sl.forEach(e=>{const n=e.querySelector('.in');if(n)n.addEventListener('scroll',()=>e.classList.toggle('ov',n.scrollHeight>n.clientHeight+24&&n.scrollTop<24),{passive:true})});
  go(Math.min(MI,sl.length-1),false);upd();setTimeout(upd,600);
}
mq.addEventListener?mq.addEventListener('change',()=>app()):mq.addListener(()=>app());
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');
  if(t&&t.dataset.proto&&MV[t.dataset.proto]){e.preventDefault();openProto(t.dataset.proto,t.dataset.pt);return}
  if(t&&t.dataset.pvclose){document.getElementById('lbHost').innerHTML='';return}
  if(t&&t.dataset.pvnew){const u=URL.createObjectURL(new Blob([MV[t.dataset.pvnew]],{type:'text/html'}));window.open(u,'_blank');return}
  if(e.target.closest('.lb')){document.getElementById('lbHost').innerHTML='';return}
  if(!t)return;
  if(t.dataset.l){L=t.dataset.l;try{localStorage.setItem('mm-lang',L)}catch(x){}document.documentElement.lang=L;app();return}
  if(t.dataset.f){F=(F===t.dataset.f&&F!=='all')?'all':t.dataset.f;applyFilter();return}
  if(t.dataset.go){F=t.dataset.go;applyFilter();const first=[...document.querySelectorAll('.ch:not(.dim)')][0];if(first)first.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.dataset.copy){const v=t.dataset.copy,s=S[L];const done=()=>{t.textContent=s.copied;setTimeout(()=>t.textContent=s.copy,1400)};
    try{navigator.clipboard.writeText(v).then(done,()=>{})}catch(x){}return}
  if(t.classList.contains('pol')||t.classList.contains('mp')||t.classList.contains('mph')){
    document.getElementById('lbHost').innerHTML=`<div class="lb" role="dialog" aria-label="${S[L].close}"><figure><img src="${IMG[t.dataset.img]}" alt=""><figcaption>${esc(t.dataset.cap)}</figcaption></figure></div>`;return}
});

 fr:'<svg class="fl" viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true"><rect width="1" height="2" fill="#0055A4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#EF4135"/></svg>',
 nl:'<svg class="fl" viewBox="0 0 9 6" preserveAspectRatio="none" aria-hidden="true"><rect width="9" height="2" fill="#AE1C28"/><rect y="2" width="9" height="2" fill="#fff"/><rect y="4" width="9" height="2" fill="#21468B"/></svg>',
 en:'<svg class="fl" viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><clipPath id="ukc"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath><path d="M0,0v30h60v-30z" fill="#012169"/><path d="M0,0 60,30M60,0 0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 60,30M60,0 0,30" clip-path="url(#ukc)" stroke="#C8102E" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></svg>',
 de:'<svg class="fl" viewBox="0 0 5 3" preserveAspectRatio="none" aria-hidden="true"><rect width="5" height="1" fill="#000"/><rect y="1" width="5" height="1" fill="#DD0000"/><rect y="2" width="5" height="1" fill="#FFCE00"/></svg>'};
const SP={fr:{h:'Bonjour',n:'Français',go:'Lire en français'},nl:{h:'Hallo',n:'Nederlands',go:'Lees in het Nederlands'},en:{h:'Hello',n:'English',go:'Read in English'},de:{h:'Guten Tag',n:'Deutsch',go:'Auf Deutsch lesen'}};
function splash(){
  let seen=false;try{seen=sessionStorage.getItem('mm-sp')==='1'}catch(e){}
  if(seen)return;
  const host=document.getElementById('splash');
  const nav=(navigator.language||'fr').slice(0,2).toLowerCase();
  host.innerHTML=`<div class="sh"><b>Max Moor<i>.</i></b><p><span>Choose your language</span></p></div>
   <div class="ps">${LANGS.map((l,k)=>`<button type="button" class="lp${l===nav?' rec':''}" data-sp="${l}" style="--k:${k}" aria-label="${SP[l].n}">${FLAGS[l]}<span class="lg">${l.toUpperCase()}</span><span class="tx"><small>${SP[l].n}</small><h2>${SP[l].h}</h2><span class="go">${SP[l].go} <b>→</b></span></span></button>`).join('')}</div>
   <div class="sf">Portfolio · FR · NL · EN · DE</div>`;
  host.hidden=false;document.body.classList.add('sp');
  host.onclick=e=>{const b=e.target.closest('[data-sp]');if(!b)return;
    L=b.dataset.sp;try{localStorage.setItem('mm-lang',L);sessionStorage.setItem('mm-sp','1')}catch(x){}
    document.documentElement.lang=L;app();host.classList.add('out');document.body.classList.remove('sp');
    setTimeout(()=>{host.hidden=true;host.innerHTML='';host.classList.remove('out')},650)};
}
document.documentElement.lang=L;
app();
splash();
