<title>MealVend – Weekly menu</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8ef;--card:#fff;--ink:#23302b;--mut:#6d7a73;--ac:#ff5a5f;--ac2:#14a58a;--line:#eadfce;--mach:#2b3a4a}

:root[data-theme="dark"]{--bg:#161c1a;--card:#212a27;--ink:#f1efe8;--mut:#9aa8a1;--line:#33403b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:10px 20px 8px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:1.3rem}.logo span{color:var(--ac)}
nav button{border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:8px 14px;border-radius:99px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}
#weeks{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
.wk{flex:0 0 auto;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:6px 14px;font:inherit;cursor:pointer;text-align:left;transition:.15s}
.wk small{display:block;font-size:.6rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}.wk b{font-size:.88rem;white-space:nowrap}
.wk.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 13%,var(--card))}
main{max-width:1100px;margin:auto;padding:18px;display:grid;grid-template-columns:1fr 340px;gap:24px}
h2{margin:18px 0 8px;font-size:1.05rem}h2 small{color:var(--mut);font-weight:500;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px}
.card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;background:var(--card);border:2px solid var(--line);border-radius:16px;color:var(--ink);font:inherit;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-2px)}.card .e{font-size:2rem}.card b{font-size:.85rem;text-align:center}.card i{font-style:normal;color:var(--ac2);font-weight:700;font-size:.85rem}
.card em{font-style:normal;font-size:.66rem;color:var(--mut);text-align:center;line-height:1.2}
.card.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--card))}
aside{position:sticky;top:130px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.bowl{width:100%;aspect-ratio:1;border-radius:50%;background:#d9d2c3;padding:7%;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12),0 8px 18px rgba(0,0,0,.18)}
.bowl.v-plate{background:#f6f6f1;box-shadow:inset 0 0 0 6px #e4e4dc,0 8px 18px rgba(0,0,0,.18)}
.bowl.v-board{background:#b98d57;border-radius:20%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 8px 18px rgba(0,0,0,.18)}
.food{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;box-shadow:inset 0 4px 10px rgba(0,0,0,.25)}
.v-board .food{border-radius:14%}
.food span{position:absolute;transform:translate(-50%,-50%);line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));animation:pop .35s}
.sauce{position:absolute;inset:22%;border-radius:50%;border:4px dashed;opacity:.75;transform:rotate(20deg)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(0)}}
ul{list-style:none;padding:0;margin:12px 0}li{display:flex;justify-content:space-between;padding:3px 0;font-size:.9rem;border-bottom:1px dashed var(--line)}
.tot{display:flex;justify-content:space-between;font-size:1.3rem;font-weight:800;margin:8px 0}
.go{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.go:disabled{opacity:.4;cursor:not-allowed}.hint{font-size:.8rem;color:var(--mut);text-align:center;margin-top:6px;min-height:1.2em}
#mac{margin:12px 0 4px}.kc{font-size:.9rem;color:var(--mut)}.kc b{font-size:1.9rem;color:var(--ink)}.kc span{float:right;line-height:2.2}
.mb{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin:6px 0}.mb s{display:block;height:100%;transition:width .3s}
.ml{display:flex;justify-content:space-between;font-size:.78rem;color:var(--mut)}.ml i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.ml b{color:var(--ink);display:block;font-size:1rem}
.note{font-size:.68rem;color:var(--mut);margin-top:8px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
#ov{position:fixed;inset:0;background:rgba(10,15,20,.85);display:none;align-items:center;justify-content:center;z-index:20;padding:12px;overflow:auto}
#ov.on{display:flex}
.mach{width:min(520px,100%);background:var(--mach);border-radius:24px;padding:16px;color:#fff;border:4px solid #4d6075;position:relative;margin:auto}
.mach h3{margin:0 0 10px;text-align:center;letter-spacing:.2em;font-size:.9rem;color:#9fd8ff}
.slots{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:#1b2631;padding:8px;border-radius:12px}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:rgba(255,255,255,.07);border-radius:8px;opacity:.45;transition:.2s}
.cell.glow{opacity:1;background:#ffd34d55;box-shadow:0 0 14px #ffd34d;transform:scale(1.15)}
.win{margin:12px auto 6px;width:85%;background:#0e151c;border:3px solid #5f7a93;border-radius:16px;padding:10px}
#msg{text-align:center;font-weight:700;min-height:1.5em;color:#ffd34d}
.fly{position:fixed;font-size:1.6rem;z-index:40;pointer-events:none}
.ready{text-align:center}.ready .bowl{width:min(250px,60vw);margin:8px auto;animation:rise .8s}
@keyframes rise{from{transform:translateY(60px) scale(.6);opacity:0}}
.ticket{background:#fffdf5;color:#222;max-width:300px;margin:10px auto;padding:12px;border-radius:6px;font-family:monospace;text-align:left}
.ticket li{border-color:#ccc}
.sbtn{padding:10px 18px;border:0;border-radius:99px;background:var(--ac2);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.bags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.bag{width:70px;height:94px;background:linear-gradient(#dcbd8e,#c49a63);border-radius:3px 3px 8px 8px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;color:#3b2a17;cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.35);transition:opacity .3s,filter .3s}
.bag:before{content:'';position:absolute;top:0;left:0;right:0;height:13px;background:#b78c55;border-bottom:2px dashed #8d6a3b;border-radius:3px 3px 0 0}
.bag span{font-size:1.7rem}.bag small{font-size:.62rem;font-weight:700;text-align:center;line-height:1.1}
.bag:not(.done):hover{transform:translateY(-4px)}.bag.done{opacity:.3;filter:grayscale(1);cursor:default}
.tray{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:flex-end;min-height:100px}
.tray .bag{width:36px;height:46px;cursor:default;animation:drop .4s;padding-bottom:3px}.tray .bag small{display:none}.tray .bag span{font-size:1rem}

.tip{color:#9fd8ff;font-size:.85rem;margin:4px 0}
.pcard{display:flex;flex-direction:column;gap:2px;padding:12px;text-align:left;background:linear-gradient(135deg,color-mix(in srgb,var(--ac2) 14%,var(--card)),var(--card));border:2px solid var(--line);border-radius:16px;color:var(--ink);font:inherit;cursor:pointer;transition:.15s}

.go.alt{background:transparent;color:var(--ac);border:2px solid var(--ac);margin-top:8px}
.slot{border:2px solid #5f7a93;background:transparent;color:#fff;padding:6px 14px;border-radius:99px;font:inherit;cursor:pointer}.slot.on{background:var(--ac);border-color:var(--ac)}
#ai{grid-column:1/-1;display:none}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}

.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.two{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.chat{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow-y:auto;padding-right:4px}
.me{align-self:flex-end;background:var(--ac);color:#fff;padding:8px 14px;border-radius:16px 16px 4px 16px;max-width:85%}
.bot{align-self:stretch;background:color-mix(in srgb,var(--ac2) 8%,var(--card));border:1px solid var(--line);padding:6px 14px 12px;border-radius:16px 16px 16px 4px}

.card{position:relative}

.deal-row{display:grid;grid-template-columns:1.3fr 1.7fr .8fr 1fr;gap:8px;align-items:center;font-size:.88rem;padding:7px 0;border-bottom:1px dashed var(--line)}

.sbar{position:relative;height:10px;background:var(--line);border-radius:5px}.sbar s{display:block;height:100%;background:var(--ac2);border-radius:5px;text-decoration:none}.sbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);text-decoration:none}
@media(max-width:820px){.deal-row{grid-template-columns:1fr 1fr}}
.bar{display:none}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}

@media(max-width:820px){header{position:static}main{grid-template-columns:1fr}aside{position:static}.bar{display:flex;position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);gap:12px;align-items:center;z-index:6}.bar b{font-size:1.2rem}.bar .go{flex:1}.bar .go.alt{margin:0;flex:.9;padding:14px 8px}aside .go{display:none}main{padding-bottom:90px}}

const sing=w=>w.replace(/ies$/,'y').replace(/s$/,'');
const TOK={};ALLN.forEach(n=>TOK[n]=n.toLowerCase().split(/[^a-zà-ÿ']+/).filter(t=>t.length>=3&&!STOP.has(sing(t))).map(sing));
const THW=[/poke|\bbowl\b/,/pasta|spaghetti|penne|lasagn|carbonara|bolognese/,/sandwich|baguette|\bsub\b|panini/,/burrito|taco|mexican|nacho|quesadilla/,/\bwok\b|stir[- ]?fry|noodle|asian/,/salad|salade/];
function parse(txt){
  const q=txt.toLowerCase(),P={ex:new Set(),exG:new Set(),exW:new Set(),likeN:new Set(),likeG:new Set(),likeW:new Set(),theme:null};
  if(/\bvegan\b/.test(q))P.diet='vegan';else if(/vegetarian|veggie\b|plant[- ]based/.test(q))P.diet='vegetarian';else if(/pescatarian|pescetarian/.test(q))P.diet='pescatarian';

  if(!P.maxPrice&&/cheap|budget|student price/.test(q))P.maxPrice=6;

}
function allowed(n,P){
  if(P.ex.has(n))return false;for(const g of P.exG)if(GR[g].has(n))return false;
  if(P.diet=='vegan'&&['meat','fish','shell','egg','dairy','honey'].some(g=>GR[g].has(n)))return false;
  if(P.diet=='vegetarian'&&['meat','fish','shell'].some(g=>GR[g].has(n)))return false;
  if(P.diet=='pescatarian'&&GR.meat.has(n))return false;if(P.halal&&GR.pork.has(n))return false;if(P.gf&&GR.gluten.has(n))return false;return true;
}
function understood(P){
  const c=[];if(P.diet)c.push(P.diet);if(P.halal)c.push('halal');if(P.gf)c.push('gluten-free');
  [...P.exG].forEach(g=>c.push('no '+(GL[g]||g)));[...P.exW].forEach(w=>c.push('no '+w));
  if(P.maxPrice)c.push('≤ '+fmt(P.maxPrice));if(P.maxKcal)c.push('≤ '+P.maxKcal+' kcal');if(P.minKcal)c.push('≥ '+P.minKcal+' kcal');if(P.minProt)c.push('protein ≥ '+P.minProt+' g');if(P.lowCarb)c.push('low carb');

function solve(P){
  const th=T,pools=th.steps.map(st=>st.items.map((it,i)=>({it,i})).filter(x=>allowed(x.it[0],P)));
  const bad=th.steps.findIndex((st,k)=>pools[k].length<st.min);
  if(bad>=0)return {fail:`I can't build a ${th.noun} for that this week – nothing in “${th.steps[bad].t}” (${th.name}) fits those rules. Try another week or relax one rule.`};
  const run=hard=>{
    const out=[],seen=new Set();
    for(let t=0;t<4000;t++){
      const s=th.steps.map((st,k)=>{const pool=pools[k];let n;
        if(st.kind=='base')n=1;else if(st.kind=='main')n=(st.max>1&&R()<(P.goal=='protein'?.65:.3))?2:1;else if(st.kind=='ring')n=st.max<2?1:1+(R()*Math.min(st.max,4)|0);else if(st.kind=='small')n=R()<.5?1:0;else n=(st.min>0||R()<.85)?1:0;

}
function botHtml(P,r,note){
  const ch=understood(P),w=W;let warn=false;

    const rs=[];if(P.maxPrice)rs.push([o.pr<=P.maxPrice+1e-9,`${fmt(o.pr)} (limit ${fmt(P.maxPrice)})`]);if(P.maxKcal)rs.push([o.m[1]<=P.maxKcal,`${kc(o.m)} kcal (max ${P.maxKcal})`]);if(P.minKcal)rs.push([o.m[1]>=P.minKcal,`${kc(o.m)} kcal (min ${P.minKcal})`]);if(P.minProt)rs.push([o.m[2]>=P.minProt,`${Math.round(o.m[2])} g protein (min ${P.minProt})`]);

const EX=['Vegetarian, high protein, under €7','No peanuts, under 600 kcal','Spicy chicken with mango','Gluten-free pasta with 35 g protein','Cheap halal wok','Vegan salad, no mushrooms'];
